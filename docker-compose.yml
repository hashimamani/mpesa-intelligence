name: mpesa-intelligence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpesa
      POSTGRES_PASSWORD: mpesa_local_password
      POSTGRES_DB: mpesa_intelligence
    ports:
      # Host port 5433, not 5432 — this machine already runs a native Postgres
      # on 5432 and Docker's loopback binding silently loses to it.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpesa -d mpesa_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for S3. Production uses real private S3 buckets (see docs/03-architecture.md).
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mpesa_local
      MINIO_ROOT_PASSWORD: mpesa_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
